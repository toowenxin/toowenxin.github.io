<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>

    <div class="recommendation">
        <div class="eyebrow-heading">CHEF 'S</div>
        <div class="hero-title">RECOMMENDATION</div>
    </div>

    <div class="recommendation-dishes">

        <div class="dish-card">
            <div class="object-title">
                <span style="color: var(--color-text-light);">Butter-Poached Lobster</span>
            </div>
            <div><img src="images/Butter-Poached Lobster.png" alt="Butter-Poached Lobster" width="345px"></div>
        </div>

        <div class="dish-card">
            <div class="object-title">
                <span style="color: var(--color-text-light);">Chocolate Ball On Cake</span>
            </div>
            <div><img src="images/Chocolate Ball On Cake.png" alt="Chocolate Ball On Cake" width="345px"></div>
        </div>

        <div class="dish-card">
            <div class="object-title">
                <span style="color: var(--color-text-light);">Duck Breast with Cherry Sauce</span>
            </div>
            <div><img src="images/Duck Breast with Cherry Sauce.png" alt="Duck Breast with Cherry Sauce" width="345px">
            </div>
        </div>

    </div>

    <div>
        <div><img src="images/main-course.png" alt="Main Course" width="100%">
        </div>
        <div class="main-course">
            <div class="hero-title">
                <span style="color: var(--color-text-dark);">Main Course</span>
            </div>
            <div class="object-title">
                <span style="color: var(--color-text-dark);">Braised Abalone</span>
            </div>
            <div class="eyebrow-heading">$52</div>
            <p class="paragraph">Premium abalone slowly braised in a rich savory sauce until tender and flavorful.</p>
        </div>
    </div>
</body>

</html>
