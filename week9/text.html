<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.relative {
            position: relative;
            width: 50%;
            height: 200px;
            margin: auto;
            border: 3px solid red;
        }

        .box1 {
            position: absolute;
            width: 200px;
            top: 20px;
            right: -80px;
            border: 3px solid blue;
        }

        .box2 {
            position: absolute;
            width: 200px;
            height: 50px;
            bottom: 20px;
            left: -80px;
            border: 3px solid blue;
        }
    </style>
</head>

<body>
    <div class="relative">
        <div class="box1"> box1</div>
        <div class="box2"> box2</div>
    </div>
</body>

</html>
